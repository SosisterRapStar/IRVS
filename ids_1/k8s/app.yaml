apiVersion: v1
kind: Service
metadata:
  name: tasks-api
  namespace: sosister-rap-star
spec:
  selector:
    app.kubernetes.io/name: tasks-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api
  namespace: sosister-rap-star
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasks-api
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: migrate
          image: ghcr.io/sosisterrapstar/irvs-tasks:hw2-v2
          imagePullPolicy: Always
          command:
            - sh
            - -ec
            - |
              until pg_isready; do
                sleep 2
              done
              export PGPASSWORD="$(cat /run/secrets/postgres/password)"
              exec psql -X -v ON_ERROR_STOP=1 --single-transaction \
                -c 'SELECT pg_advisory_xact_lock(1)' \
                -f /migrations/000001_init.up.sql
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-auth
              mountPath: /run/secrets/postgres
              readOnly: true
      containers:
        - name: app
          image: ghcr.io/sosisterrapstar/irvs-tasks:hw2-v2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB
            - name: DB_PASSWORD_FILE
              value: /run/secrets/postgres/password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: postgres-auth
              mountPath: /run/secrets/postgres
              readOnly: true
      volumes:
        - name: postgres-auth
          secret:
            secretName: postgres-auth
            items:
              - key: POSTGRES_PASSWORD
                path: password
