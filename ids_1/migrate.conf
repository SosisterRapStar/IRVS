MIGRATE_PATH="${MIGRATE_PATH:-migrations}"
MIGRATE_DB_HOST="${MIGRATE_DB_HOST:-localhost}"
MIGRATE_DB_PORT="${MIGRATE_DB_PORT:-${DB_EXPOSED_PORT:?DB_EXPOSED_PORT is not set}}"
MIGRATE_DATABASE_URL="postgres://${DB_USER:?DB_USER is not set}:${DB_PASSWORD:?DB_PASSWORD is not set}@${MIGRATE_DB_HOST}:${MIGRATE_DB_PORT}/${DB_NAME:?DB_NAME is not set}?sslmode=${DB_SSLMODE:-disable}"
